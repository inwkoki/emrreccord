# Render.com Blueprint — static site (no build step needed).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: emrreccord-chat
    runtime: static
    # The site is plain static files at the repo root — nothing to build.
    buildCommand: ""
    staticPublishPath: .
    # SPA-style: serve index.html for unknown paths.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # Files are unhashed and auto-deploy on every push, so force the browser
      # to revalidate rather than serve a stale build after a deploy.
      - path: /*
        name: Cache-Control
        value: no-cache
